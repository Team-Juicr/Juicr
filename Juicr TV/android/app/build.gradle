plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigningConfig =
    keystoreProperties["storeFile"] &&
    keystoreProperties["storePassword"] &&
    keystoreProperties["keyAlias"] &&
    keystoreProperties["keyPassword"]
def enableP2pRuntime =
    project.findProperty("JUICR_ENABLE_P2P_RUNTIME")
        ?: System.getenv("JUICR_ENABLE_P2P_RUNTIME")
        ?: "false"
def p2pNativeRoot = file("../../native_16kb_overrides/release")
def requiredP2pNativeInputs = [
    "arm64-v8a/libjlibtorrent-1.2.0.18.so",
    "arm64-v8a/libjuicr_jlibtorrent_shim.so",
    "armeabi-v7a/libc++_shared.so",
    "armeabi-v7a/libjlibtorrent-1.2.0.18.so",
    "armeabi-v7a/libjuicr_jlibtorrent_shim.so",
    "x86_64/libjlibtorrent-1.2.0.18.so",
    "x86_64/libjuicr_jlibtorrent_shim.so",
].collect { new File(p2pNativeRoot, it) }
def p2pBuildCapable = requiredP2pNativeInputs.every { it.exists() }

android {
    namespace = "app.juicr.flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "app.juicr.flutter"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "boolean", "JUICR_ENABLE_P2P_RUNTIME", enableP2pRuntime.toString().toBoolean().toString()
        buildConfigField "boolean", "JUICR_P2P_BUILD_CAPABLE", p2pBuildCapable.toString()
    }

    sourceSets {
        main {
            jniLibs.srcDirs += file("../../native_16kb_overrides/release")
        }
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
        pickFirst "lib/**/libjlibtorrent-1.2.0.18.so"
    }

    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        profile {
            initWith debug
        }
        release {
            signingConfig = hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.11.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.0"
    implementation "androidx.media3:media3-ui:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "com.frostwire:jlibtorrent:1.2.0.18"
    implementation "com.frostwire:jlibtorrent-android-arm:1.2.0.18"
    implementation "com.frostwire:jlibtorrent-android-arm64:1.2.0.18"
    implementation "com.frostwire:jlibtorrent-android-x86_64:1.2.0.18"
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:5.5.0"
}

tasks.register("runP2pContractTest") {
    dependsOn "compileDebugUnitTestKotlin"
}
